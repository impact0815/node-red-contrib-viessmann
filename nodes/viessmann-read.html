<script type="text/javascript">
    RED.nodes.registerType('viessmann-read', {
        category: 'Viessmann',
        color: '#ff7f50',
        icon: 'font-awesome/fa-thermometer-half',
        defaults: {
            name: { value: '' },
            server: { value: '', type: 'viessmann-config', required: true },
            selection: { value: 'all' },
            features: { value: [] },
            pattern: { value: '' },
            outputFormat: { value: 'object' },
            onlyAvailable: { value: true },
            topicPrefix: { value: 'viessmann' },
            interval: { value: 300, validate: RED.validators.number() },
            startupDelay: { value: 10, validate: RED.validators.number() },
            staleAfter: { value: 900, validate: RED.validators.number() },
            forceRefresh: { value: false }
        },
        inputs: 1,
        outputs: 2,
        paletteLabel: function () {
            return this._('viessmann-read.paletteLabel');
        },
        outputLabels: function (i) {
            return this._(i === 0 ? 'viessmann-read.outputs.data' : 'viessmann-read.outputs.status');
        },
        label: function () {
            return this.name || this._('viessmann-read.paletteLabel');
        },
        oneditprepare: function () {
            var node = this;
            var _ = this._;

            $('#node-input-features-list').editableList({
                addItem: function (row, index, data) {
                    $('<input/>', {
                        class: 'vm-feature-entry', type: 'text', style: 'width:100%',
                        placeholder: _('viessmann-read.placeholder.feature')
                    }).val(typeof data === 'string' ? data : '').appendTo(row);
                },
                removable: true,
                sortable: true
            });
            (node.features || []).forEach(function (f) {
                $('#node-input-features-list').editableList('addItem', f);
            });

            function toggleSelection() {
                var mode = $('#node-input-selection').val();
                $('.vm-row-selected').toggle(mode === 'selected');
                $('.vm-row-pattern').toggle(mode === 'pattern');
            }
            $('#node-input-selection').on('change', toggleSelection);
            toggleSelection();

            // Selection straight from the device – the user only sees what his system delivers.
            $('#vm-load-features').on('click', function () {
                var serverId = $('#node-input-server').val();
                var $info = $('#vm-features-info');
                if (!serverId || serverId === '_ADD_') {
                    $info.css('color', '#c62828').text(_('viessmann-read.editor.needServer'));
                    return;
                }
                $info.css('color', '#888').text(_('viessmann-read.editor.loading'));
                $.getJSON('viessmann/' + serverId + '/features?refresh=true')
                    .done(function (d) {
                        var $sel = $('#vm-feature-picker').empty();
                        d.features.forEach(function (f) {
                            if (!f.available) return;
                            var label = f.feature + (f.writable ? '  ✎' : '') +
                                (f.deprecated ? '  ⚠ ' + _('viessmann-read.editor.deprecated') : '');
                            $('<option/>').val(f.feature).text(label).appendTo($sel);
                        });
                        $info.css('color', '#2e7d32').text(_('viessmann-read.editor.loaded', d.summary));
                    })
                    .fail(function (x) {
                        $info.css('color', '#c62828').text(_('viessmann-read.editor.error') + ': ' +
                            ((x.responseJSON && x.responseJSON.error) || _('viessmann-read.editor.notSaved')));
                    });
            });

            $('#vm-add-selected').on('click', function () {
                ($('#vm-feature-picker').val() || []).forEach(function (f) {
                    $('#node-input-features-list').editableList('addItem', f);
                });
            });
        },
        oneditsave: function () {
            var features = [];
            $('#node-input-features-list').editableList('items').each(function () {
                var v = $(this).find('.vm-feature-entry').val();
                if (v && v.trim()) features.push(v.trim());
            });
            this.features = features;
        }
    });
</script>

<script type="text/html" data-template-name="viessmann-read">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="viessmann-read.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]viessmann-read.placeholder.name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-cog"></i> <span data-i18n="viessmann-read.label.server"></span></label>
        <input type="text" id="node-input-server">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-selection"><i class="fa fa-filter"></i> <span data-i18n="viessmann-read.label.selection"></span></label>
        <select id="node-input-selection">
            <option value="all" data-i18n="viessmann-read.selection.all"></option>
            <option value="selected" data-i18n="viessmann-read.selection.selected"></option>
            <option value="pattern" data-i18n="viessmann-read.selection.pattern"></option>
        </select>
    </div>
    <div class="form-row vm-row-pattern">
        <label for="node-input-pattern"><i class="fa fa-asterisk"></i> <span data-i18n="viessmann-read.label.pattern"></span></label>
        <input type="text" id="node-input-pattern" data-i18n="[placeholder]viessmann-read.placeholder.pattern">
    </div>
    <div class="vm-row-selected">
        <div class="form-row">
            <button type="button" class="red-ui-button" id="vm-load-features">
                <i class="fa fa-refresh"></i> <span data-i18n="viessmann-read.button.load"></span>
            </button>
            <span id="vm-features-info" style="margin-left:8px;font-size:0.85em"></span>
        </div>
        <div class="form-row">
            <select id="vm-feature-picker" multiple size="8" style="width:100%"></select>
        </div>
        <div class="form-row">
            <button type="button" class="red-ui-button" id="vm-add-selected">
                <i class="fa fa-plus"></i> <span data-i18n="viessmann-read.button.add"></span>
            </button>
        </div>
        <div class="form-row">
            <label style="width:100%"><i class="fa fa-list"></i> <span data-i18n="viessmann-read.label.chosen"></span></label>
            <ol id="node-input-features-list"></ol>
        </div>
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-outputFormat"><i class="fa fa-sign-out"></i> <span data-i18n="viessmann-read.label.output"></span></label>
        <select id="node-input-outputFormat">
            <option value="object" data-i18n="viessmann-read.output.object"></option>
            <option value="flat" data-i18n="viessmann-read.output.flat"></option>
            <option value="split" data-i18n="viessmann-read.output.split"></option>
            <option value="raw" data-i18n="viessmann-read.output.raw"></option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-topicPrefix"><i class="fa fa-tags"></i> <span data-i18n="viessmann-read.label.topicPrefix"></span></label>
        <input type="text" id="node-input-topicPrefix" placeholder="viessmann">
    </div>
    <div class="form-row">
        <label for="node-input-onlyAvailable" style="width:auto">
            <input type="checkbox" id="node-input-onlyAvailable" style="width:auto;vertical-align:top">
            <span data-i18n="viessmann-read.label.onlyAvailable"></span>
        </label>
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-interval"><i class="fa fa-repeat"></i> <span data-i18n="viessmann-read.label.interval"></span></label>
        <input type="number" id="node-input-interval" min="0" style="width:90px"> <span data-i18n="viessmann-read.label.secondsZero"></span>
    </div>
    <div class="form-row">
        <label for="node-input-startupDelay"><i class="fa fa-play"></i> <span data-i18n="viessmann-read.label.startupDelay"></span></label>
        <input type="number" id="node-input-startupDelay" min="0" style="width:90px"> <span data-i18n="viessmann-read.label.seconds"></span>
    </div>
    <div class="form-row">
        <label for="node-input-staleAfter"><i class="fa fa-exclamation-triangle"></i> <span data-i18n="viessmann-read.label.staleAfter"></span></label>
        <input type="number" id="node-input-staleAfter" min="0" style="width:90px"> <span data-i18n="viessmann-read.label.seconds"></span>
    </div>
    <div class="form-row">
        <label for="node-input-forceRefresh" style="width:auto">
            <input type="checkbox" id="node-input-forceRefresh" style="width:auto;vertical-align:top">
            <span data-i18n="viessmann-read.label.forceRefresh"></span>
        </label>
    </div>
</script>
