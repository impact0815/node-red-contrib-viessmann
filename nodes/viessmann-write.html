<script type="text/javascript">
    RED.nodes.registerType('viessmann-write', {
        category: 'Viessmann',
        color: '#ff7f50',
        icon: 'font-awesome/fa-pencil',
        defaults: {
            name: { value: '' },
            server: { value: '', type: 'viessmann-config', required: true },
            feature: { value: '' },
            command: { value: '' },
            paramSource: { value: 'payload' },
            fixedParams: { value: '' },
            skipIfUnchanged: { value: true },
            dryRun: { value: false },
            topicPrefix: { value: 'viessmann' }
        },
        inputs: 1,
        outputs: 2,
        paletteLabel: function () {
            return this._('viessmann-write.paletteLabel');
        },
        outputLabels: function (i) {
            return this._(i === 0 ? 'viessmann-write.outputs.result' : 'viessmann-write.outputs.error');
        },
        label: function () {
            if (this.name) return this.name;
            if (this.feature && this.command) return this.command + ' → ' + this.feature.split('.').slice(-2).join('.');
            return this._('viessmann-write.paletteLabel');
        },
        oneditprepare: function () {
            var node = this;
            var _ = this._;
            var catalog = {};
            var esc = function (s) { return $('<div>').text(String(s)).html(); };

            function renderCommands(selectedCommand) {
                var f = catalog[$('#node-input-feature').val()];
                var $cmd = $('#node-input-command').empty();
                if (!f) {
                    $('<option/>').val(node.command || '')
                        .text(node.command || _('viessmann-write.editor.loadFirst')).appendTo($cmd);
                    return;
                }
                f.commands.forEach(function (c) {
                    $('<option/>').val(c.name)
                        .text(c.name + (c.executable ? '' : '  (' + _('viessmann-write.editor.notExecutable') + ')'))
                        .appendTo($cmd);
                });
                if (selectedCommand) $cmd.val(selectedCommand);
                renderConstraints();
            }

            function renderConstraints() {
                var f = catalog[$('#node-input-feature').val()];
                var $box = $('#vm-constraints').empty();
                if (!f) return;
                var c = f.commands.filter(function (x) { return x.name === $('#node-input-command').val(); })[0];
                if (!c) return;
                var names = Object.keys(c.params || {});
                if (!names.length) {
                    $box.html('<div>' + _('viessmann-write.editor.noParams') + '</div>');
                    return;
                }
                var lim = function (key, v) { return _('viessmann-write.editor.' + key, { v: v }); };
                var example = {};
                var html = '<table style="width:100%;font-size:0.85em"><tr>' +
                    '<th align="left">' + esc(_('viessmann-write.editor.thParam')) + '</th>' +
                    '<th align="left">' + esc(_('viessmann-write.editor.thType')) + '</th>' +
                    '<th align="left">' + esc(_('viessmann-write.editor.thLimits')) + '</th></tr>';
                names.forEach(function (n) {
                    var p = c.params[n];
                    var cs = p.constraints || {};
                    var limits = [];
                    if (cs.min !== undefined) limits.push(lim('min', cs.min));
                    if (cs.max !== undefined) limits.push(lim('max', cs.max));
                    if (cs.stepping !== undefined) limits.push(lim('step', cs.stepping));
                    if (cs.enum) limits.push(cs.enum.join(' | '));
                    if (cs.modes) limits.push(lim('modes', cs.modes.join(' | ')));
                    if (cs.maxEntries !== undefined) limits.push(lim('maxEntries', cs.maxEntries));
                    if (cs.resolution !== undefined) limits.push(lim('resolution', cs.resolution));
                    if (cs.minLength !== undefined) limits.push(lim('minLength', cs.minLength));
                    if (cs.maxLength !== undefined) limits.push(lim('maxLength', cs.maxLength));
                    if (cs.regEx) limits.push(lim('regEx', cs.regEx));
                    html += '<tr><td><code>' + esc(n) + '</code>' + (p.required ? ' *' : '') + '</td><td>' +
                            esc(p.type || '?') + '</td><td>' + esc(limits.join(', ') || '–') + '</td></tr>';
                    example[n] = cs.min !== undefined ? cs.min : (cs.enum ? cs.enum[0] : (p.type === 'number' ? 0 : ''));
                });
                html += '</table><div style="margin-top:6px">' + esc(_('viessmann-write.editor.example')) +
                        ': <code>msg.payload = ' + esc(JSON.stringify(example)) + '</code></div>';
                $box.html(html);
            }

            $('#vm-load-catalog').on('click', function () {
                var serverId = $('#node-input-server').val();
                var $info = $('#vm-write-info');
                if (!serverId || serverId === '_ADD_') {
                    $info.css('color', '#c62828').text(_('viessmann-write.editor.needServer'));
                    return;
                }
                $info.css('color', '#888').text(_('viessmann-write.editor.loading'));
                $.getJSON('viessmann/' + serverId + '/features?refresh=true')
                    .done(function (d) {
                        catalog = {};
                        var $sel = $('#node-input-feature').empty();
                        var count = 0;
                        d.features.forEach(function (f) {
                            if (!f.available || !f.writable) return;
                            catalog[f.feature] = f;
                            $('<option/>').val(f.feature).text(f.feature).appendTo($sel);
                            count++;
                        });
                        if (node.feature && !catalog[node.feature]) {
                            $('<option/>').val(node.feature)
                                .text(node.feature + '  (' + _('viessmann-write.editor.notAvailable') + ')').appendTo($sel);
                        }
                        $sel.val(node.feature || $sel.find('option:first').val());
                        renderCommands(node.command);
                        $info.css('color', '#2e7d32').text(_('viessmann-write.editor.loaded', { count: count }));
                    })
                    .fail(function (x) {
                        $info.css('color', '#c62828').text(_('viessmann-write.editor.error') + ': ' +
                            ((x.responseJSON && x.responseJSON.error) || _('viessmann-write.editor.notSaved')));
                    });
            });

            $('#node-input-feature').on('change', function () { renderCommands(); });
            $('#node-input-command').on('change', renderConstraints);

            if (node.feature) $('<option/>').val(node.feature).text(node.feature).appendTo($('#node-input-feature'));
            if (node.command) $('<option/>').val(node.command).text(node.command).appendTo($('#node-input-command'));
            $('#node-input-feature').val(node.feature);
            $('#node-input-command').val(node.command);

            function toggleParams() {
                $('.vm-row-fixed').toggle($('#node-input-paramSource').val() === 'fixed');
            }
            $('#node-input-paramSource').on('change', toggleParams);
            toggleParams();
        }
    });
</script>

<script type="text/html" data-template-name="viessmann-write">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="viessmann-write.label.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]viessmann-write.placeholder.name">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-cog"></i> <span data-i18n="viessmann-write.label.server"></span></label>
        <input type="text" id="node-input-server">
    </div>
    <hr>
    <div class="form-row">
        <button type="button" class="red-ui-button" id="vm-load-catalog">
            <i class="fa fa-refresh"></i> <span data-i18n="viessmann-write.button.load"></span>
        </button>
        <span id="vm-write-info" style="margin-left:8px;font-size:0.85em"></span>
    </div>
    <div class="form-row">
        <label for="node-input-feature"><i class="fa fa-crosshairs"></i> <span data-i18n="viessmann-write.label.feature"></span></label>
        <select id="node-input-feature" style="width:70%"></select>
    </div>
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-bolt"></i> <span data-i18n="viessmann-write.label.command"></span></label>
        <select id="node-input-command" style="width:70%"></select>
    </div>
    <div class="form-row">
        <label style="width:100%"><i class="fa fa-info-circle"></i> <span data-i18n="viessmann-write.label.allowed"></span></label>
        <div id="vm-constraints" style="border:1px solid #ddd;padding:8px;border-radius:4px;background:#fafafa"></div>
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-paramSource"><i class="fa fa-sliders"></i> <span data-i18n="viessmann-write.label.paramSource"></span></label>
        <select id="node-input-paramSource">
            <option value="payload" data-i18n="viessmann-write.paramSource.payload"></option>
            <option value="fixed" data-i18n="viessmann-write.paramSource.fixed"></option>
        </select>
    </div>
    <div class="form-row vm-row-fixed">
        <label for="node-input-fixedParams" data-i18n="viessmann-write.label.json"></label>
        <input type="text" id="node-input-fixedParams" data-i18n="[placeholder]viessmann-write.placeholder.json">
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-skipIfUnchanged" style="width:auto">
            <input type="checkbox" id="node-input-skipIfUnchanged" style="width:auto;vertical-align:top">
            <span data-i18n="viessmann-write.label.skipIfUnchanged"></span>
        </label>
    </div>
    <div class="form-row">
        <label for="node-input-dryRun" style="width:auto">
            <input type="checkbox" id="node-input-dryRun" style="width:auto;vertical-align:top">
            <b data-i18n="viessmann-write.label.dryRun"></b> <span data-i18n="viessmann-write.label.dryRunHint"></span>
        </label>
    </div>
    <div class="form-row">
        <label for="node-input-topicPrefix"><i class="fa fa-tags"></i> <span data-i18n="viessmann-write.label.topicPrefix"></span></label>
        <input type="text" id="node-input-topicPrefix" placeholder="viessmann">
    </div>
</script>
