<script type="text/javascript">
    RED.nodes.registerType('viessmann-config', {
        category: 'config',
        defaults: {
            name: { value: '' },
            redirectUri: { value: 'http://localhost:1880/authcode', required: true },
            installationId: { value: '' },
            gatewaySerial: { value: '' },
            deviceId: { value: '0' },
            iamHost: { value: 'https://iam.viessmann-climatesolutions.com', required: true },
            apiHost: { value: 'https://api.viessmann-climatesolutions.com', required: true },
            timeout: { value: 20000, validate: RED.validators.number() },
            cacheTtl: { value: 30, validate: RED.validators.number() },
            allowWrite: { value: false },
            minWriteInterval: { value: 5, validate: RED.validators.number() }
        },
        credentials: {
            clientId: { type: 'text' },
            username: { type: 'text' },
            password: { type: 'password' },
            codeChallenge: { type: 'password' },
            refreshToken: { type: 'password' }
        },
        label: function () {
            return this.name || 'Viessmann API';
        },
        oneditprepare: function () {
            var nodeId = this.id;
            var _ = this._;
            var esc = function (s) { return $('<div>').text(String(s)).html(); };

            // Code challenge: 43–128 characters from A–Z a–z 0–9 - . _ ~
            $('#vm-gen-challenge').on('click', function () {
                var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
                var bytes = new Uint8Array(64);
                window.crypto.getRandomValues(bytes);
                var out = '';
                for (var i = 0; i < bytes.length; i++) out += chars.charAt(bytes[i] % chars.length);
                $('#node-config-input-codeChallenge').val(out).trigger('change');
                $('#vm-challenge-info').css('color', '#2e7d32').text(_('viessmann-config.editor.challengeGenerated'));
            });

            $('#viessmann-test').on('click', function () {
                var $r = $('#viessmann-test-result');
                $('#viessmann-test').prop('disabled', true);
                $r.css('color', '#888').html('<i class="fa fa-spinner fa-spin"></i> ' + esc(_('viessmann-config.editor.testing')));

                $.ajax({
                    url: 'viessmann/test',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        id: nodeId,
                        clientId: $('#node-config-input-clientId').val(),
                        username: $('#node-config-input-username').val(),
                        password: $('#node-config-input-password').val(),
                        codeChallenge: $('#node-config-input-codeChallenge').val(),
                        redirectUri: $('#node-config-input-redirectUri').val(),
                        iamHost: $('#node-config-input-iamHost').val(),
                        apiHost: $('#node-config-input-apiHost').val(),
                        installationId: $('#node-config-input-installationId').val(),
                        gatewaySerial: $('#node-config-input-gatewaySerial').val(),
                        deviceId: $('#node-config-input-deviceId').val()
                    })
                }).done(function (d) {
                    if (d.ok) {
                        $r.css('color', '#2e7d32').html(
                            '<b><i class="fa fa-check-circle"></i> ' + esc(_('viessmann-config.editor.connected')) + '</b><br>' +
                            esc(_('viessmann-config.editor.installation')) + ': ' + esc(d.targets.installationId) + '<br>' +
                            esc(_('viessmann-config.editor.gateway')) + ': ' + esc(d.targets.gatewaySerial) + '<br>' +
                            esc(_('viessmann-config.editor.device')) + ': ' + esc(d.targets.deviceId) + '<br>' +
                            esc(_('viessmann-config.editor.datapoints', d.summary))
                        );
                    } else {
                        var done = (d.steps && d.steps.length)
                            ? (esc(_('viessmann-config.editor.done')) + ': ' + esc(d.steps.join(' → ')) + '<br>') : '';
                        $r.css('color', '#c62828').html(done + '<b>' + esc(_('viessmann-config.editor.error')) + ':</b> ' + esc(d.error));
                    }
                }).fail(function (x) {
                    $r.css('color', '#c62828').text(_('viessmann-config.editor.error') + ': ' +
                        ((x.responseJSON && x.responseJSON.error) || x.statusText));
                }).always(function () {
                    $('#viessmann-test').prop('disabled', false);
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="viessmann-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="viessmann-config.label.name"></span></label>
        <input type="text" id="node-config-input-name" data-i18n="[placeholder]viessmann-config.placeholder.name">
    </div>

    <hr>
    <h4 style="margin-bottom:4px" data-i18n="viessmann-config.section.portal"></h4>
    <div style="font-size:0.88em;color:#666;margin-bottom:8px" data-i18n="[html]viessmann-config.hint.portal"></div>
    <div class="form-row">
        <label for="node-config-input-clientId"><i class="fa fa-id-card"></i> <span data-i18n="viessmann-config.label.clientId"></span></label>
        <input type="text" id="node-config-input-clientId" data-i18n="[placeholder]viessmann-config.placeholder.clientId">
    </div>
    <div class="form-row">
        <label for="node-config-input-redirectUri"><i class="fa fa-reply"></i> <span data-i18n="viessmann-config.label.redirectUri"></span></label>
        <input type="text" id="node-config-input-redirectUri" data-i18n="[placeholder]viessmann-config.placeholder.redirectUri">
    </div>
    <div class="form-tips" style="margin-bottom:12px;font-size:0.85em" data-i18n="[html]viessmann-config.hint.redirectUri"></div>
    <div class="form-row">
        <label for="node-config-input-codeChallenge"><i class="fa fa-key"></i> <span data-i18n="viessmann-config.label.codeChallenge"></span></label>
        <input type="password" id="node-config-input-codeChallenge" style="width:calc(70% - 110px)" data-i18n="[placeholder]viessmann-config.placeholder.codeChallenge">
        <button type="button" class="red-ui-button" id="vm-gen-challenge" style="width:100px">
            <i class="fa fa-random"></i> <span data-i18n="viessmann-config.button.generate"></span>
        </button>
    </div>
    <div id="vm-challenge-info" class="form-tips" style="margin-bottom:12px;font-size:0.85em" data-i18n="[html]viessmann-config.hint.codeChallenge"></div>

    <hr>
    <h4 style="margin-bottom:4px" data-i18n="viessmann-config.section.account"></h4>
    <div style="font-size:0.88em;color:#666;margin-bottom:8px" data-i18n="viessmann-config.hint.account"></div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> <span data-i18n="viessmann-config.label.username"></span></label>
        <input type="text" id="node-config-input-username" autocomplete="off" data-i18n="[placeholder]viessmann-config.placeholder.username">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-lock"></i> <span data-i18n="viessmann-config.label.password"></span></label>
        <input type="password" id="node-config-input-password" autocomplete="new-password">
    </div>

    <div class="form-row">
        <button type="button" class="red-ui-button" id="viessmann-test" style="width:100%">
            <i class="fa fa-plug"></i> <span data-i18n="viessmann-config.button.test"></span>
        </button>
        <div id="viessmann-test-result" style="margin-top:8px;font-size:0.9em;line-height:1.5"></div>
    </div>

    <hr>
    <h4><span data-i18n="viessmann-config.section.system"></span> <small style="font-weight:normal" data-i18n="viessmann-config.section.systemHint"></small></h4>
    <div class="form-row">
        <label for="node-config-input-installationId"><i class="fa fa-home"></i> <span data-i18n="viessmann-config.label.installation"></span></label>
        <input type="text" id="node-config-input-installationId" data-i18n="[placeholder]viessmann-config.placeholder.auto">
    </div>
    <div class="form-row">
        <label for="node-config-input-gatewaySerial"><i class="fa fa-wifi"></i> <span data-i18n="viessmann-config.label.gateway"></span></label>
        <input type="text" id="node-config-input-gatewaySerial" data-i18n="[placeholder]viessmann-config.placeholder.auto">
    </div>
    <div class="form-row">
        <label for="node-config-input-deviceId"><i class="fa fa-microchip"></i> <span data-i18n="viessmann-config.label.device"></span></label>
        <input type="text" id="node-config-input-deviceId" placeholder="0">
    </div>

    <hr>
    <h4 data-i18n="viessmann-config.section.behavior"></h4>
    <div class="form-row">
        <label for="node-config-input-cacheTtl"><i class="fa fa-clock-o"></i> <span data-i18n="viessmann-config.label.cache"></span></label>
        <input type="number" id="node-config-input-cacheTtl" min="0" style="width:80px"> <span data-i18n="viessmann-config.label.seconds"></span>
    </div>
    <div class="form-row">
        <label for="node-config-input-timeout"><i class="fa fa-hourglass-half"></i> <span data-i18n="viessmann-config.label.timeout"></span></label>
        <input type="number" id="node-config-input-timeout" min="1000" step="1000" style="width:100px"> <span data-i18n="viessmann-config.label.ms"></span>
    </div>
    <div class="form-row">
        <label for="node-config-input-allowWrite" style="width:auto">
            <input type="checkbox" id="node-config-input-allowWrite" style="width:auto;vertical-align:top">
            <b data-i18n="viessmann-config.label.allowWrite"></b>
        </label>
    </div>
    <div class="form-row">
        <label for="node-config-input-minWriteInterval"><i class="fa fa-shield"></i> <span data-i18n="viessmann-config.label.minWriteInterval"></span></label>
        <input type="number" id="node-config-input-minWriteInterval" min="0" style="width:80px"> <span data-i18n="viessmann-config.label.secondsGap"></span>
    </div>

    <hr>
    <details>
        <summary data-i18n="viessmann-config.section.advanced"></summary>
        <div class="form-row" style="margin-top:8px">
            <label for="node-config-input-iamHost" data-i18n="viessmann-config.label.iamHost"></label>
            <input type="text" id="node-config-input-iamHost">
        </div>
        <div class="form-row">
            <label for="node-config-input-apiHost" data-i18n="viessmann-config.label.apiHost"></label>
            <input type="text" id="node-config-input-apiHost">
        </div>
    </details>
    <input type="password" id="node-config-input-refreshToken" style="display:none">
</script>
