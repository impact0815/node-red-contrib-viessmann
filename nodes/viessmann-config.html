<script type="text/javascript">
    RED.nodes.registerType('viessmann-config', {
        category: 'config',
        defaults: {
            name: { value: '' },
            redirectUri: { value: 'http://localhost:1880/authcode', required: true },
            installationId: { value: '' },
            gatewaySerial: { value: '' },
            deviceId: { value: '0' },
            iamHost: { value: 'https://iam.viessmann-climatesolutions.com', required: true },
            apiHost: { value: 'https://api.viessmann-climatesolutions.com', required: true },
            timeout: { value: 20000, validate: RED.validators.number() },
            cacheTtl: { value: 30, validate: RED.validators.number() },
            allowWrite: { value: false },
            minWriteInterval: { value: 5, validate: RED.validators.number() }
        },
        credentials: {
            clientId: { type: 'text' },
            username: { type: 'text' },
            password: { type: 'password' },
            codeChallenge: { type: 'password' },
            refreshToken: { type: 'password' }
        },
        label: function () {
            return this.name || 'Viessmann API';
        },
        oneditprepare: function () {
            var nodeId = this.id;

            // Code Challenge: 43–128 Zeichen aus A–Z a–z 0–9 - . _ ~
            $('#vm-gen-challenge').on('click', function () {
                var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
                var bytes = new Uint8Array(64);
                window.crypto.getRandomValues(bytes);
                var out = '';
                for (var i = 0; i < bytes.length; i++) out += chars.charAt(bytes[i] % chars.length);
                $('#node-config-input-codeChallenge').val(out).trigger('change');
                $('#vm-challenge-info').css('color', '#2e7d32').text('Neue Code Challenge erzeugt (64 Zeichen).');
            });

            $('#viessmann-test').on('click', function () {
                var $r = $('#viessmann-test-result');
                $('#viessmann-test').prop('disabled', true);
                $r.css('color', '#888').html('<i class="fa fa-spinner fa-spin"></i> Melde mich bei Viessmann an …');

                $.ajax({
                    url: 'viessmann/test',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        id: nodeId,
                        clientId: $('#node-config-input-clientId').val(),
                        username: $('#node-config-input-username').val(),
                        password: $('#node-config-input-password').val(),
                        codeChallenge: $('#node-config-input-codeChallenge').val(),
                        redirectUri: $('#node-config-input-redirectUri').val(),
                        iamHost: $('#node-config-input-iamHost').val(),
                        apiHost: $('#node-config-input-apiHost').val(),
                        installationId: $('#node-config-input-installationId').val(),
                        gatewaySerial: $('#node-config-input-gatewaySerial').val(),
                        deviceId: $('#node-config-input-deviceId').val()
                    })
                }).done(function (d) {
                    if (d.ok) {
                        $r.css('color', '#2e7d32').html(
                            '<b><i class="fa fa-check-circle"></i> Verbindung steht.</b><br>' +
                            'Installation: ' + d.targets.installationId +
                            '<br>Gateway: ' + d.targets.gatewaySerial +
                            '<br>Gerät: ' + d.targets.deviceId +
                            '<br>Datenpunkte: ' + d.summary.available + ' von ' + d.summary.total +
                            ' verfügbar, ' + d.summary.writable + ' beschreibbar.'
                        );
                    } else {
                        var done = (d.steps && d.steps.length) ? ('Erledigt: ' + d.steps.join(' → ') + '<br>') : '';
                        $r.css('color', '#c62828').html(done + '<b>Fehler:</b> ' + $('<div>').text(d.error).html());
                    }
                }).fail(function (x) {
                    $r.css('color', '#c62828').text('Fehler: ' + ((x.responseJSON && x.responseJSON.error) || x.statusText));
                }).always(function () {
                    $('#viessmann-test').prop('disabled', false);
                });
            });
        }
    });
</script>

<script type="text/html" data-template-name="viessmann-config">

    </div>
    <div class="form-row">

        erzeugt die Node bei jeder Anmeldung selbst eine.

    <hr>
    <h4 style="margin-bottom:4px">ViCare-Konto</h4>
    <div style="font-size:0.88em;color:#666;margin-bottom:8px">
        Dieselben Zugangsdaten wie in der ViCare-App.
    </div>
    <div class="form-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> Benutzername</label>
        <input type="text" id="node-config-input-username" placeholder="E-Mail-Adresse" autocomplete="off">
    </div>
    <div class="form-row">
        <label for="node-config-input-password"><i class="fa fa-lock"></i> Passwort</label>
        <input type="password" id="node-config-input-password" autocomplete="new-password">
    </div>

    <div class="form-row">
        <button type="button" class="red-ui-button" id="viessmann-test" style="width:100%">
            <i class="fa fa-plug"></i> Verbindung testen
        </button>
        <div id="viessmann-test-result" style="margin-top:8px;font-size:0.9em;line-height:1.5"></div>
    </div>

    <hr>
    <h4>Anlage <small style="font-weight:normal">(leer lassen = automatisch ermitteln)</small></h4>
    <div class="form-row">
        <label for="node-config-input-installationId"><i class="fa fa-home"></i> Installation</label>
        <input type="text" id="node-config-input-installationId" placeholder="automatisch">
    </div>
    <div class="form-row">
        <label for="node-config-input-gatewaySerial"><i class="fa fa-wifi"></i> Gateway</label>
        <input type="text" id="node-config-input-gatewaySerial" placeholder="automatisch">
    </div>
    <div class="form-row">
        <label for="node-config-input-deviceId"><i class="fa fa-microchip"></i> Gerät</label>
        <input type="text" id="node-config-input-deviceId" placeholder="0">
    </div>

    <hr>
    <h4>Verhalten</h4>
    <div class="form-row">
        <label for="node-config-input-cacheTtl"><i class="fa fa-clock-o"></i> Cache</label>
        <input type="number" id="node-config-input-cacheTtl" min="0" style="width:80px"> Sekunden
    </div>
    <div class="form-row">
        <label for="node-config-input-timeout"><i class="fa fa-hourglass-half"></i> Timeout</label>
        <input type="number" id="node-config-input-timeout" min="1000" step="1000" style="width:100px"> ms
    </div>
    <div class="form-row">
        <label for="node-config-input-allowWrite" style="width:auto">
            <input type="checkbox" id="node-config-input-allowWrite" style="width:auto;vertical-align:top">
            <b>Schreibzugriff erlauben</b>
        </label>
    </div>
    <div class="form-row">
        <label for="node-config-input-minWriteInterval"><i class="fa fa-shield"></i> Schreibsperre</label>
        <input type="number" id="node-config-input-minWriteInterval" min="0" style="width:80px"> Sekunden Mindestabstand
    </div>

    <hr>
    <details>
        <summary>Erweiterte Einstellungen (Endpunkte)</summary>
        <div class="form-row" style="margin-top:8px">
            <label for="node-config-input-iamHost">IAM-Host</label>
            <input type="text" id="node-config-input-iamHost">
        </div>
        <div class="form-row">
            <label for="node-config-input-apiHost">API-Host</label>
            <input type="text" id="node-config-input-apiHost">
        </div>
    </details>
    <input type="password" id="node-config-input-refreshToken" style="display:none">
</script>

<script type="text/html" data-help-name="viessmann-config">
    <p>Zentrale Verbindung zur Viessmann IoT API. Die Node meldet sich <b>vollautomatisch</b> an,
    holt und erneuert alle Token selbst und teilt einen gemeinsamen Datencache mit allen Lese- und
    Schreib-Nodes.</p>

    <h3>Voraussetzungen</h3>
    <ol>
        <li>Die Anlage ist in der <b>ViCare-App</b> registriert und funktioniert dort.</li>
        <li>Im <a href="https://app.developer.viessmann-climatesolutions.com" target="_blank" rel="noopener">Viessmann
        Developer Portal</a> (Anmeldung mit denselben Zugangsdaten wie ViCare) existiert unter
        <i>Your Clients</i> ein Client mit <b>ausgeschaltetem Google reCAPTCHA</b> und einer
        Redirect-URI, z. B. <code>http://localhost:1880/authcode</code>.</li>
    </ol>
    <p>Wer den Zugang schon nach der Rustimation-Anleitung eingerichtet hat, übernimmt einfach die
    vorhandene Client-ID, Redirect-URI und Code Challenge.</p>

    <h3>Was eingetragen werden muss</h3>
    <dl class="message-properties">
        <dt>Client-ID</dt>
        <dd>Aus dem Developer Portal. Pro Konto ist genau ein Client möglich.</dd>

        <dt>Redirect-URI</dt>
        <dd>Genau die Adresse, die beim Client im Portal hinterlegt ist – <b>zeichengenau</b>, inklusive
        <code>http</code>/<code>https</code>, Hostname, Port, Pfad und ggf. abschließendem Schrägstrich.
        Am sichersten aus dem Portal kopieren. Unter dieser Adresse muss <b>nichts</b> lauschen:
        Die Node folgt der Weiterleitung von Viessmann nicht, sondern liest den Code direkt aus der
        Antwort. Deshalb funktioniert das auch in Docker, Home Assistant oder ioBroker, ohne dass
        Ports oder Pfade freigegeben werden müssen.</dd>

        <dt>Code Challenge</dt>
        <dd>Das PKCE-Geheimnis der Anmeldung. Eine vorhandene aus einem bestehenden Flow übernehmen,
        mit <b>erzeugen</b> neu anlegen oder leer lassen – dann erzeugt die Node bei jeder Anmeldung
        selbst eine frische.</dd>

        <dt>Benutzername / Passwort</dt>
        <dd>Die Zugangsdaten der <b>ViCare-App</b>. Beides wird verschlüsselt in den Node-RED-Credentials
        gespeichert und landet nie in der Flow-Datei oder einem Export.</dd>
    </dl>
    <p>Danach <b>Verbindung testen</b> – das funktioniert schon vor dem ersten Deploy und meldet bei
    Erfolg Installation, Gateway, Gerät und die Zahl der verfügbaren Datenpunkte.</p>

    <h3>Was die Node daraus automatisch macht</h3>
    <ol>
        <li><b>Refresh Token vorhanden?</b> Dann wird damit ein Access Token geholt.</li>
        <li><b>Kein Refresh Token</b> (Erststart) oder von Viessmann <b>abgelehnt</b>? Dann meldet sich die
        Node mit Benutzer und Passwort an, liest den Authorization Code aus der Weiterleitung und tauscht
        ihn gegen neue Token.</li>
        <li>Das Access Token wird kurz vor Ablauf erneuert, nach einem HTTP 401 sofort.</li>
        <li>Bei Netzwerkfehlern wird <b>nicht</b> neu angemeldet – das würde nichts ändern.</li>
    </ol>

    <h3>Weitere Einstellungen</h3>
    <dl class="message-properties">
        <dt>Installation / Gateway / Gerät</dt>
        <dd>Leer lassen – die Node ermittelt die Werte selbst. Gerät <code>0</code> ist bei
        Vitoconnect-Anlagen der Regler. Nur bei mehreren Anlagen lohnt eine feste Angabe.</dd>
        <dt>Cache</dt>
        <dd>So lange wird eine bereits geholte Datenliste wiederverwendet. Empfehlung: mindestens
        <b>30 Sekunden</b>. Die API hat ein Tageslimit, und alle Lese-Nodes an dieser Konfiguration
        teilen sich den Cache.</dd>
        <dt>Schreibzugriff erlauben</dt>
        <dd>Standardmäßig aus. Erst mit diesem Haken führt die Schreib-Node Befehle aus. So kann ein
        versehentlich importierter Flow nichts an der Heizung verstellen.</dd>
        <dt>Schreibsperre</dt>
        <dd>Mindestabstand zwischen zwei Schreibvorgängen, schützt vor Endlosschleifen. 5 bis 10 Sekunden
        sind sinnvoll.</dd>
    </dl>

    <h3>Symptom → Ursache → Lösung</h3>
    <dl class="message-properties">
        <dt>„Invalid redirection URI“</dt>
        <dd>Die Redirect-URI weicht von der im Portal ab. Die Fehlermeldung zeigt die gesendete Adresse –
        mit dem Portal vergleichen und von dort kopieren.</dd>
        <dt>„Viessmann verlangt eine interaktive Anmeldung“</dt>
        <dd>Google reCAPTCHA ist im Portal noch aktiv, oder die Redirect-URI weicht ab.</dd>
        <dt>„Anmeldung abgelehnt (HTTP 401)“</dt>
        <dd>ViCare-Benutzername oder Passwort falsch.</dd>
        <dt>„Code-Einlösung fehlgeschlagen“</dt>
        <dd>Meist eine abweichende Redirect-URI oder Client-ID.</dd>
        <dt>„Die Code Challenge ist ungültig“</dt>
        <dd>Zu kurz oder unerlaubte Zeichen. Neu erzeugen oder leer lassen.</dd>
        <dt>„Keine Installation gefunden“</dt>
        <dd>Anlage nicht in der ViCare-App registriert oder anderes Konto verwendet.</dd>
        <dt>HTTP 429</dt>
        <dd>Rate Limit. Intervall und Cache erhöhen, eine gemeinsame Konfiguration nutzen. Alte Flows,
        die parallel noch selbst abfragen, deaktivieren.</dd>
        <dt>Zeitüberschreitung / Netzwerkfehler</dt>
        <dd>Kein Internet aus dem Container. Test:
        <code>docker exec node-red ping -c1 api.viessmann-climatesolutions.com</code></dd>
    </dl>

    <h3>Haftungsausschluss</h3>
    <p><b>Nutzung auf eigene Gefahr, ohne Gewähr.</b> Inoffizielles Projekt, keine Verbindung zu
    Viessmann. Schreibbefehle verändern die Einstellungen der Heizungsanlage; für Schäden oder Kosten
    wird keine Haftung übernommen. <i>Use at your own risk – no warranty.</i></p>

    <p><i>Der Zugangsweg zur API folgt der Anleitung von
    <a href="https://www.rustimation.eu/index.php/1_zugang_api/" target="_blank" rel="noopener">Rustimation.eu</a>.
    Vielen Dank für diese Vorarbeit.</i></p>
</script>
