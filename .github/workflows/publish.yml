name: Publish to npm

# Veröffentlicht auf npm, sobald auf GitHub ein Release veröffentlicht wird.
# Anmeldung über npm Trusted Publishing (OIDC) – kein NPM_TOKEN nötig.
# Einmalig auf npmjs.com beim Paket einrichten:
#   Settings → Trusted Publisher → GitHub Actions
#   Benutzer: impact0815 · Repository: node-red-contrib-viessmann · Workflow: publish.yml
# Die allererste Version muss von Hand mit "npm publish" veröffentlicht werden.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: npm mit Trusted-Publishing-Unterstützung (>= 11.5.1)
        run: npm install -g npm@latest
      - run: npm run lint
      - run: npm test
      - run: npm publish --access public
