name: Publish to npm

# Publishes to npm as soon as a release is published on GitHub.
# Authentication via npm Trusted Publishing (OIDC) – no NPM_TOKEN needed.
# One-time setup on npmjs.com for the package:
#   Settings → Trusted Publisher → GitHub Actions
#   Organization or user: impact0815 · Repository: node-red-contrib-viessmann · Workflow: publish.yml
# The very first version has to be published manually with "npm publish".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@latest
      - run: npm run lint
      - run: npm test
      - run: npm publish --access public
